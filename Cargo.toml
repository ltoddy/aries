[package]
name = "Aries"
version = "0.1.0"
edition = "2024"
authors = ["ltoddy <taoliu0509@gmail.com>"]
resolver = "3"

[[bin]]
name = "aries"
path = "src/main.rs"

[workspace]
members = [
    "crates/aries-acp",
    "crates/aries-context",
    "crates/aries-core",
]

[workspace.dependencies]
anyhow = "1"
colored = "3"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
nanoid = "0.4.0"
rig-core = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false }

[dependencies]
aries-acp = { path = "crates/aries-acp" }
aries-context = { path = "crates/aries-context" }
aries-core = { path = "crates/aries-core" }

anyhow.workspace = true
colored.workspace = true
dialoguer.workspace = true
rig-core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process"] }

clap = { version = "4", features = ["derive"] }
directories = "6.0"
ferris-says = "0.3.2"
rustyline = "18.0"
rustyline-derive = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
