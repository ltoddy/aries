[workspace]
members = [
    "crates/aries-cli",
    "crates/aries-acp",
    "crates/aries-config",
    "crates/aries-context",
    "crates/aries-core",
    "crates/aries-session",
    "crates/aries-theme",
]
default-members = ["crates/aries-cli"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "0.10"
anyhow = "1"
async-trait = "0.1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
colored = "3"
dark-light = "2.0"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
diffy = "0.4"
ferris-says = "0.3.2"
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
itertools = "0.14"
nanoid = "0.5.0"
parking_lot = "0.12"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rig-core = "0.33"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
terminal_size = "0.4"
thiserror = "2.0"
tokio = { version = "1", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["compat"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
