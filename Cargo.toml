[package]
name = "aries"
version = "0.1.0"
edition = "2024"
authors = ["ltoddy <taoliu0509@gmail.com>"]

[dependencies]
anyhow = "1"
colored = "3"
futures = "0.3"
rig-core = "0.33.0"
rustyline = "17.0.2"
rustyline-derive = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
