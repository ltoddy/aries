[package]
name = "aries"
version = "0.1.0"
edition = "2024"
authors = ["ltoddy <taoliu0509@gmail.com>"]

[dependencies]
anyhow = "1"
colored = "3"
dialoguer = "0.12"
diffy = "0.4"
directories = "6.0"
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
regex = "1"
reqwest = "0.13"
rig-core = "0.33"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "signal"] }
uuid = { version = "1.23", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
