[package]
name = "aries-orbit"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "0.9.0", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
agent-client-protocol = { version = "5.0", features = ["process", "unstable"] }
anyhow = "1.0"
async-channel = "2.5"
base64 = "0.23"
dirs = "7.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3.2"
toml = "1.1"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "process", "io-util"] }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
