[workspace]
members = [
    "crates/aries-acp",
    "crates/aries-communicate",
    "crates/aries-extension",
    "crates/aries-filesystem",
    "crates/aries-init",
    "crates/aries-logger",
    "crates/aries-persistence",
    "crates/aries-runtime",
    "apps/aries-cli",
]
default-members = ["apps/aries-cli"]
resolver = "3"

[workspace.package]
authors = ["ltoddy <taoliu0509@gmail.com>"]
categories = ["command-line-utilities", "development-tools"]
description = "A terminal AI coding assistant"
keywords = ["ai", "agent", "terminal", "acp", "cli"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/ltoddy/aries"

[workspace.dependencies]
agent-client-protocol = { version = "5.0", features = ["unstable"] }
base64 = "0.23"
colored = "3.1"
futures = "0.3"
http = "1.4"
ignore = "0.4"
itertools = "0.15"
jiff = "0.2"
nanoid = "0.5"
parking_lot = "0.13"
prettytable = { package = "prettytable-rs", version = "0.10" }
regex-lite = "0.1"
reqwest = "0.13"
rig = { version = "0.46", default-features = false, features = [
    "agent",
] }
serde = "1.0"
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
toasty = "0.11"
tokio = "1"
tracing = "0.1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
yaml_serde = "0.10"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
