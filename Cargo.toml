[workspace]
members = [
    "crates/aries",
    "crates/aries-acp",
    "crates/aries-config",
    "crates/aries-context",
    "crates/aries-core",
    "crates/aries-session",
]
default-members = ["crates/aries"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "0.10"
anyhow = "1"
async-trait = "0.1"
clap = "4"
colored = "3"
dark-light = "2.0"
dialoguer = "0.12"
diffy = "0.4"
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
itertools = "0.14"
nanoid = "0.5"
parking_lot = "0.12"
regex-lite = "0.1"
reqwest = "0.13"
rig-core = "0.33"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = "1"
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
terminal_size = "0.4"
thiserror = "2.0"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2.5"
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
