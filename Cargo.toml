[workspace]
members = [
    "crates/aries-acp",
    "crates/aries-cli",
    "crates/aries-context",
    "crates/aries-core",
    "crates/aries-extension",
    "crates/aries-filesystem",
    "crates/aries-harness",
    "crates/aries-init",
    "crates/aries-logger",
    "crates/aries-memory",
    "crates/aries-sandbox",
    "crates/aries-selfimprove",
    "crates/aries-session",
    "crates/aries-telemetry",
    "crates/aries-tokenopt",
    "crates/aries-workflow",
]
default-members = ["crates/aries-cli"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "0.15"
anyhow = "1"
clap = "4"
colored = "3"
dark-light = "2.0"
dialoguer = "0.12"
dirs = "6"
ferris-says = "0.3"
futures = "0.3"
git2 = "0.21"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
itertools = "0.15"
jiff = "0.2"
nanoid = "0.5"
parking_lot = "0.12"
prettytable-rs = "0.10"
regex-lite = "0.1"
reqwest = "0.13"
rig-core = "0.39"
rustyline = "18.0"
rustyline-derive = "0.12"
schemars = "1"
serde = "1"
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
terminal_size = "0.4"
thiserror = "2.0"
toasty = "0.7"
tokio = "1"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2.5"
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
