[workspace]
members = [
    "crates/aries-acp",
    "crates/aries-cli",
    "crates/aries-config",
    "crates/aries-context",
    "crates/aries-core",
    "crates/aries-harness",
    "crates/aries-session",
]
default-members = ["crates/aries-cli"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "0.13"
anyhow = "1"
clap = "4"
colored = "3"
dark-light = "2.0"
dialoguer = "0.12"
futures = "0.3"
git2 = "0.20"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
itertools = "0.14"
jiff = "0.2"
nanoid = "0.5"
parking_lot = "0.12"
prettytable-rs = "0.10"
regex-lite = "0.1"
reqwest = "0.13"
rig-core = "0.37"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = "1"
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
terminal_size = "0.4"
thiserror = "2.0"
toasty = "0.5"
tokio = "1"
tokio-util = "0.7"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2.5"
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
