[workspace]
members = [
    "crates/aries-cli",
    "crates/aries-acp",
    "crates/aries-config",
    "crates/aries-context",
    "crates/aries-core",
    "crates/aries-session",
    "crates/aries-theme",
]
default-members = ["crates/aries-cli"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
colored = "3"
dialoguer = { version = "0.12", default-features = false, features = ["fuzzy-select"] }
futures = "0.3"
nanoid = "0.4.0"
rig-core = "0.33"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", default-features = false }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
