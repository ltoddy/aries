[package]
name = "Aries"
version = "0.1.0"
edition = "2024"
authors = ["ltoddy <taoliu0509@gmail.com>"]

[[bin]]
name = "aries"
path = "src/main.rs"

[dependencies]
agent-client-protocol = "0.10"
anyhow = "1"
async-trait = "0.1.89"
clap = { version = "4", features = ["derive"] }
colored = "3"
dark-light = "2.0"
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
diffy = "0.4"
directories = "6.0"
ferris-says = "0.3"
futures = "0.3"
glob = "0.3"
globset = "0.4"
ignore = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
reqwest = "0.13"
rig-core = "0.33"
rustyline = "18.0"
rustyline-derive = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-std", "signal"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
uuid = { version = "1.23", features = ["v4"] }
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
