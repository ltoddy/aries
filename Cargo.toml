[package]
name = "aries"
version = "0.1.0"
edition = "2024"
authors = ["ltoddy <taoliu0509@gmail.com>"]

[dependencies]
anyhow = "1"
colored = "3"
dialoguer = "0.12.0"
futures = "0.3"
glob = "0.3"
globset = "0.4.18"
regex = "1.12.3"
reqwest = "0.13.2"
rig-core = "0.33.0"
rustyline = "17.0.2"
rustyline-derive = "0.11.1"
schemars = "1.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
similar = "2.7"
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
uuid = { version = "1.22.0", features = ["v4"] }

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
