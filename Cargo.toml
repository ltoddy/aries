[workspace]
members = [
    "crates/aries-acp",
    "crates/aries-agent",
    "crates/aries-cli",
    "crates/aries-compact",
    "crates/aries-context",
    "crates/aries-cron",
    "crates/aries-daemon",
    "crates/aries-event",
    "crates/aries-extension",
    "crates/aries-filesystem",
    "crates/aries-init",
    "crates/aries-logger",
    "crates/aries-lspclient",
    "crates/aries-memory",
    "crates/aries-mode",
    "crates/aries-persistence",
    "crates/aries-preamble",
    "crates/aries-sandbox",
    "crates/aries-selfimprove",
    "crates/aries-session",
    "crates/aries-telemetry",
    "crates/aries-tokenopt",
    "crates/aries-tools",
    "crates/aries-workflow",
]
default-members = ["crates/aries-cli"]
resolver = "3"

[workspace.dependencies]
agent-client-protocol = "2.0"
anyhow = "1"
base64 = "0.23"
clap = "4"
colored = "3"
dialoguer = "0.12"
ferris-says = "0.3"
firecrawl = "2"
fs4 = "1"
futures = "0.3"
git2 = "0.21"
globset = "0.4"
http = "1.4"
ignore = "0.4"
itertools = "0.15"
jiff = "0.2"
mimalloc = "0.1"
nanoid = "0.5"
parking_lot = "0.12"
prettytable = { package = "prettytable-rs", version = "0.10" }
regex-lite = "0.1"
reqwest = "0.13"
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
rig = { version = "0.42" }
rmcp = "2.2"
rustyline = "18.0"
rustyline-derive = "0.12"
schemars = "1"
serde = "1"
serde_json = "1.0"
serde_repr = "0.1"
serde_yaml = "0.9"
similar = "3"
tempfile = "3"
terminal_size = "0.4"
thiserror = "2.0"
toasty = "0.9"
toasty-driver-sqlite = "0.9"
tokio = "1"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25"
url = "2.5"
whoami = "2.1"

[profile.dev]
debug = 0

[profile.release]
lto = true
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
