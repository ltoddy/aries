name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            os: macos-14
            target: x86_64-apple-darwin
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Requires the public-preview ARM runner; drop this entry if unavailable.
          - platform: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p aries-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/aries" dist/aries
          chmod +x dist/aries
          tar -czf "aries-${{ matrix.platform }}.tar.gz" -C dist aries

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/aries.exe" dist/aries.exe
          Compress-Archive -Path dist/aries.exe -DestinationPath "aries-${{ matrix.platform }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: aries-${{ matrix.platform }}
          path: aries-${{ matrix.platform }}.*
          if-no-files-found: error

  build-orbit:
    name: ${{ matrix.platform }} (orbit)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            os: macos-14
            target: aarch64-apple-darwin
          - platform: darwin-x86_64
            os: macos-14
            target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p aries-orbit

      - name: Package
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/aries-orbit" dist/aries-orbit
          chmod +x dist/aries-orbit
          tar -czf "aries-orbit-${{ matrix.platform }}.tar.gz" -C dist aries-orbit

      - uses: actions/upload-artifact@v7
        with:
          name: aries-orbit-${{ matrix.platform }}
          path: aries-orbit-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    needs: [build, build-orbit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum aries-* > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/aries-*
            dist/aries-orbit-*
            dist/SHA256SUMS
