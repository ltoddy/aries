name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - run: cargo +nightly fmt --all -- --check

  lint-crates:
    name: lint (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly clippy --workspace --exclude aries-cli --exclude aries-desktop --all-targets -- -D warnings

  test-crates:
    name: test (crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly test --workspace --exclude aries-cli --exclude aries-desktop

  lint-cli:
    name: lint (cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly clippy -p aries-cli --all-targets -- -D warnings

  test-cli:
    name: test (aries-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly test -p aries-cli --bins --tests

  lint-orbit:
    name: lint (aries-desktop)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly clippy -p aries-desktop --all-targets -- -D warnings

  test-orbit:
    name: test (aries-desktop)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2.9.3

      - run: cargo +nightly test -p aries-desktop --bins --tests

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: taiki-e/install-action@v2.88.1
        with:
          tool: cargo-audit,cargo-deny

      - run: cargo +nightly audit --ignore RUSTSEC-2023-0071

      - run: cargo +nightly deny check
