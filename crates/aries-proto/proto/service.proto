syntax = "proto3";

package aries;

service AriesService {
  rpc ListTokenUsages(ListTokenUsagesRequest) returns (ListTokenUsagesResponse);
  rpc GetTodayTokenUsage(GetTodayTokenUsageRequest) returns (GetTodayTokenUsageResponse);
  rpc ListSessionSubagents(ListSessionSubagentsRequest) returns (ListSessionSubagentsResponse);
}

message Date {
  int32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
}

message ListTokenUsagesRequest {}

message ListTokenUsagesResponse {
  repeated DailyUsage daily_usages = 1;
  repeated string projects = 2;
}

message DailyUsage {
  Date date = 1;
  TokenUsage token_usage = 2;
}

message GetTodayTokenUsageRequest {}

message GetTodayTokenUsageResponse {
  TokenUsage token_usage = 1;
}

message TokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  uint64 cached_input_tokens = 4;
  uint64 reasoning_tokens = 5;
}

message ListSessionSubagentsRequest {
  string session_id = 1;
}

message ListSessionSubagentsResponse {
  repeated Subagent subagents = 1;
}

message Subagent {
  string session_id = 1;
  string agent_id = 2;
  string name = 3;
  string description = 4;
  string last_prompt = 5;
  string dir = 6;
  int64 created_at = 7;
}
