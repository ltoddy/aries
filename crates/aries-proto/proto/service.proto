syntax = "proto3";

package aries;

service AriesService {
  rpc QueryTokenUsages(QueryTokenUsagesRequest) returns (QueryTokenUsagesResponse);
}

message Date {
  int32 year = 1;
  uint32 month = 2;
  uint32 day = 3;
}

message QueryTokenUsagesRequest {}

message QueryTokenUsagesResponse {
  repeated DailyUsage daily_usages = 1;
  repeated string projects = 2;
}

message DailyUsage {
  Date date = 1;
  TokenUsage token_usage = 2;
}

message TokenUsage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 total_tokens = 3;
  uint64 cached_input_tokens = 4;
  uint64 reasoning_tokens = 5;
}
