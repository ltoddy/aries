[package]
name = "aries-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
aries-event = { path = "../aries-event" }
aries-extension = { path = "../aries-extension" }
aries-filesystem = { path = "../aries-filesystem" }
aries-lspclient = { path = "../aries-lspclient" }
aries-mode = { path = "../aries-mode" }
aries-preamble = { path = "../aries-preamble" }
dialoguer.workspace = true
firecrawl.workspace = true
futures.workspace = true
globset.workspace = true
grep-regex.workspace = true
grep-searcher.workspace = true
ignore.workspace = true
itertools.workspace = true
jiff = { workspace = true, features = ["serde"] }
parking_lot.workspace = true
reqwest.workspace = true
rig.workspace = true
serde.workspace = true
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process"] }
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread"] }

[[bench]]
name = "grep"
harness = false
