[package]
name = "aries-extension"
version = "0.1.0"
edition = "2024"

[dependencies]
aries-filesystem = { path = "../aries-filesystem" }
futures.workspace = true
http.workspace = true
itertools.workspace = true
regex-lite.workspace = true
rig = { workspace = true, features = ["rmcp"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
