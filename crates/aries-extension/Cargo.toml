[package]
name = "aries-extension"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aries-filesystem = { version = "0.1.0", path = "../aries-filesystem" }
futures.workspace = true
http.workspace = true
itertools.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
rig = { workspace = true, features = ["rmcp"] }
rmcp = { version = "3.8", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
shell-words = "1.1"
shellexpand = "3.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util"] }
tracing.workspace = true
url.workspace = true
yaml_serde.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
