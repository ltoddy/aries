[package]
name = "aries-extension"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
aries-filesystem = { version = "0.1.0", path = "../aries-filesystem" }
futures.workspace = true
http.workspace = true
itertools.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
rig = { workspace = true, features = ["rmcp"] }
rmcp = { workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml.workspace = true
shell-words.workspace = true
shellexpand.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time", "io-util"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
