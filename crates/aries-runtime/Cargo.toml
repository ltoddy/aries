[package]
name = "aries-runtime"
version = "0.1.0"
edition = "2024"
authors.workspace = true
categories.workspace = true
description.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true

[dependencies]
aries-communicate = { version = "0.1.0", path = "../aries-communicate" }
aries-extension = { version = "0.1.0", path = "../aries-extension" }
aries-filesystem = { version = "0.1.0", path = "../aries-filesystem" }
aries-init = { version = "0.1.0", path = "../aries-init" }
aries-logger = { version = "0.1.0", path = "../aries-logger" }
aries-persistence = { version = "0.1.0", path = "../aries-persistence" }
firecrawl = "2.21"
futures.workspace = true
git2 = { workspace = true }
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
http.workspace = true
ignore.workspace = true
itertools.workspace = true
jiff = { workspace = true, features = ["serde"] }
nanoid.workspace = true
parking_lot.workspace = true
regex-lite.workspace = true
reqwest.workspace = true
reqwest-middleware = "0.5"
reqwest-retry = "0.9"
rig = { workspace = true, features = ["reqwest-middleware"] }
schemars = "1.2"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar = { workspace = true }
thiserror.workspace = true
toasty.workspace = true
tokio = { workspace = true, features = ["fs", "process", "sync", "time", "io-util"] }
tokio-util = "0.7"
tracing.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true

[dev-dependencies]
criterion = "0.8"
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "net", "process", "rt-multi-thread"] }

[[bench]]
name = "grep"
harness = false

[[bench]]
name = "glob"
harness = false
