[package]
name = "aries-session"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
aries-agent = { path = "../aries-agent" }
aries-compact = { path = "../aries-compact" }
aries-context = { version = "0.1.0", path = "../aries-context" }
aries-event = { path = "../aries-event" }
aries-extension = { path = "../aries-extension" }
aries-filesystem = { path = "../aries-filesystem" }
aries-init = { path = "../aries-init" }
aries-logger = { path = "../aries-logger" }
aries-lspclient = { path = "../aries-lspclient" }
aries-memory = { path = "../aries-memory" }
aries-mode = { path = "../aries-mode" }
aries-persistence = { path = "../aries-persistence" }
aries-preamble = { path = "../aries-preamble" }
aries-tools = { path = "../aries-tools" }
http.workspace = true
itertools.workspace = true
nanoid.workspace = true
parking_lot.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
reqwest-retry.workspace = true
rig-agent.workspace = true
rig-core = { workspace = true, features = ["reqwest-middleware"] }
rmcp.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
toasty = { workspace = true, features = ["jiff", "sqlite"] }
tokio = { workspace = true, features = ["sync", "macros"] }
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
