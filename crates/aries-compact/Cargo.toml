[package]
name = "aries-compact"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow.workspace = true
aries-context = { path = "../aries-context" }
aries-event = { path = "../aries-event" }
aries-extension = { path = "../aries-extension" }
aries-filesystem = { path = "../aries-filesystem" }
aries-tools = { path = "../aries-tools" }
futures.workspace = true
parking_lot.workspace = true
regex-lite.workspace = true
rig = { workspace = true, features = ["reqwest-middleware"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "rt"] }
