[package]
name = "aries-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "aries"
path = "src/main.rs"

[dependencies]
agent-client-protocol = { workspace = true, features = ["stdio"] }
anyhow = "1"
aries-acp = { version = "0.1.0", path = "../../crates/aries-acp" }
aries-communicate = { version = "0.1.0", path = "../../crates/aries-communicate" }
aries-extension = { version = "0.1.0", path = "../../crates/aries-extension" }
aries-init = { version = "0.1.0", path = "../../crates/aries-init" }
aries-logger = { version = "0.1.0", path = "../../crates/aries-logger" }
aries-persistence = { version = "0.1.0", path = "../../crates/aries-persistence" }
aries-runtime = { version = "0.1.0", path = "../../crates/aries-runtime" }
clap = { version = "4.6", features = ["derive"] }
colored.workspace = true
dialoguer = "0.12"
ferris-says = "0.3"
futures.workspace = true
itertools.workspace = true
jiff.workspace = true
mimalloc = "0.1"
nanoid.workspace = true
prettytable.workspace = true
rig.workspace = true
rustyline = "19.0"
rustyline-derive = "0.13"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "fs", "process"] }
tracing.workspace = true
tree-sitter = "0.26"
tree-sitter-bash = "0.25"
