[package]
name = "aries-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["process", "unstable"] }
alacritty_terminal = "0.26"
async-channel = "2.5"
aries-extension = { path = "../../crates/aries-extension" }
aries-filesystem = { path = "../../crates/aries-filesystem" }
aries-init = { path = "../../crates/aries-init" }
aries-ipc = { path = "../../crates/aries-ipc" }
aries-proto = { path = "../../crates/aries-proto" }
base64.workspace = true
dirs = "7.0"
git2 = { workspace = true, default-features = false }
gpui-kit = { version = "0.11", features = [
    "profiler",
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
ignore.workspace = true
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "ico",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
jiff.workspace = true
libc = "0.2"
notify = "8.2"
portable-pty = "0.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "net"] }
toml.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
url.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSPanel"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
raw-window-handle = { version = "0.6", features = ["std"] }
rustix = { version = "1.1", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
xcb = "1.7"
