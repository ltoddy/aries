[package]
name = "aries-desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
agent-client-protocol = { workspace = true, features = ["process", "unstable"] }
alacritty_terminal = "0.26"
async-channel = "2.5"
aries-persistence = { path = "../../crates/aries-persistence" }
base64.workspace = true
dirs = "7.0"
git2 = { workspace = true, default-features = false }
gpui-kit = { version = "0.9", features = [
    "tree-sitter",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-css",
    "tree-sitter-diff",
    "tree-sitter-go",
    "tree-sitter-html",
    "tree-sitter-java",
    "tree-sitter-javascript",
    "tree-sitter-markdown",
    "tree-sitter-python",
    "tree-sitter-rust",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
] }
jiff.workspace = true
libc = "0.2"
notify = "8.2"
portable-pty = "0.9"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
similar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "sync", "process", "io-util"] }
toml.workspace = true
toasty.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt"] }
url.workspace = true
